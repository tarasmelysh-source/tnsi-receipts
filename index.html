<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TNSI Gas Receipts</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #17212b;
    }

    .page {
      max-width: 520px;
      margin: 0 auto;
      padding: 40px 20px;
      text-align: center;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    p {
      color: #64748b;
      line-height: 1.5;
    }

    .step {
      text-align: left;
      margin-top: 28px;
      font-weight: 600;
    }

    .button {
      display: block;
      margin-top: 10px;
      padding: 16px 18px;
      background: #17212b;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: 600;
    }

    .button:hover {
      background: #263746;
    }

    .note {
      margin-top: 28px;
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>

<body>

  <div class="page">
    <div class="card">

      <h1>TNSI Gas Receipts</h1>

      <p>
        Complete both steps below to submit your gas receipt.
      </p>

      <div class="step">1. Enter receipt details</div>

      <a class="button"
         href="https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=G1zWTi6NWkOaUPlfRkmdbIUrU43J7iREp7hmd0iDj8lURDlHM0Y1SDM5RjY4TjQxOFZaSVBBU0dLMC4u"
         Enter Receipt Details
      </a>

      <div class="step">2. Upload receipt photo</div>

      <a class="button"
         href="https://truescaffold.sharepoint.com/:f:/s/TrueNorth/IgC0mEjZWXAvR42v0HV18zPHATB0zbE34NtXv5cDmOLTg1o
">
         Upload Receipt Photo
      </a>

      <div class="note">
        No TNSI login is required.
      </div>

    </div>
  </div>

</body>
</html>
