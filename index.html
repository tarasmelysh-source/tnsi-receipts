<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TNSI Gas Receipts</title>

  <style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f5f7;
    color: #17212b;
  }

  .page {
    width: 100%;
    max-width: 500px;
    margin: 0 auto;
    padding: 30px 18px;
  }

  .card {
    background: #ffffff;
    border-radius: 14px;
    padding: 30px 24px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.08);
  }

  h1 {
    margin: 0;
    text-align: center;
    font-size: 28px;
    font-weight: 700;
  }

  .intro {
    text-align: center;
    color: #64748b;
    margin: 10px 0 30px;
    font-size: 15px;
  }

  .step {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-top: 26px;
    margin-bottom: 12px;
  }

  .step-number {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #17212b;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    flex-shrink: 0;
  }

  .step-title {
    font-size: 16px;
    font-weight: 700;
  }

  .step-description {
    color: #64748b;
    font-size: 13px;
    margin-top: 3px;
    line-height: 1.4;
  }

  .button {
    display: block;
    width: 100%;
    padding: 15px 18px;
    background: #17212b;
    color: white;
    text-decoration: none;
    text-align: center;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
  }

  .button:hover {
    background: #263746;
  }

  .note {
    text-align: center;
    margin-top: 28px;
    color: #94a3b8;
    font-size: 12px;
  }
</style>
</head>

<body>

  <div class="page">
    <div class="card">

      <h1>Submit Gas Receipt</h1>

      <p class="intro">
        Enter your name when prompted and upload a clear photo of the receipt.
      </p>

      <a class="button"
         href="https://truescaffold.sharepoint.com/:f:/s/TrueNorth/IgC0mEjZWXAvR42v0HV18zPHATB0zbE34NtXv5cDmOLTg1o"
         target="_blank"
         rel="noopener noreferrer">
        Upload Receipt
      </a>

      <div class="note">
        No TNSI login is required.
      </div>

    </div>
  </div>

</body>
</html>
